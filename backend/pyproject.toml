[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-operations-api"
version = "0.1.0"
description = "Phase 1 account onboarding API for Gmail Operations SaaS"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.6,<3",
  "cryptography>=43,<46",
  "python-multipart>=0.0.9,<1",
  "redis>=5,<7",
  "playwright>=1.62,<2",
  "scrapling[fetchers]>=0.4,<1",
  "httpx>=0.27,<1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "openstacksdk>=4.4,<5",
  "rarfile>=4.1,<5",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<9", "pytest-cov>=5,<6", "fakeredis>=2.24,<3"]
# Optional last-resort control resolver for newsletter signup forms. The app
# runs unchanged without it; see app/newsletter_browser_agent.py.
agent = ["browser-use>=0.1,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
